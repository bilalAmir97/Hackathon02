[pytest]
# Pytest configuration for Phase 2 E2E testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (database, API)
    e2e: End-to-end tests (full user journeys)
    contract: Contract validation tests (schemas, OpenAPI)
    auth: Authentication and authorization tests
    database: Database integration tests
    api: API endpoint tests
    frontend: Frontend E2E tests
    slow: Tests that take longer than 5 seconds
    us1: User Story 1 - Authentication Flow
    us2: User Story 2 - Backend API Contracts
    us3: User Story 3 - Database Integration
    us4: User Story 4 - Frontend Integration

# Asyncio configuration
asyncio_mode = auto

# Coverage options (if pytest-cov is installed)
# addopts = --cov=src --cov-report=html --cov-report=term-missing

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for individual tests (requires pytest-timeout)
# timeout = 30

# Parallel execution (requires pytest-xdist)
# addopts = -n auto
