openapi: 3.0.0
info:
  title: Protected API
  version: 1.0.0
  description: API for protected endpoints requiring authentication
paths:
  /api/{user_id}/todos:
    get:
      summary: Get user's todos
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User's todos retrieved
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - user_id mismatch
    post:
      summary: Create a new todo for user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Todo created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - user_id mismatch
  /api/{user_id}/todos/{todo_id}:
    get:
      summary: Get specific todo
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: todo_id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todo retrieved
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - user_id mismatch
    put:
      summary: Update specific todo
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: todo_id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                completed:
                  type: boolean
      responses:
        '200':
          description: Todo updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - user_id mismatch
    delete:
      summary: Delete specific todo
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: todo_id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todo deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - user_id mismatch
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT