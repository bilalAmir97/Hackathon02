# Phase-IV Todo Application - Helm Values
# Configured for local Minikube deployment

# Backend Configuration
backend:
  enabled: true
  replicaCount: 1

  image:
    repository: phase-iv-backend
    tag: latest
    pullPolicy: Never  # Use local image, don't pull from registry

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  env:
    - name: DATABASE_URL
      value: "postgresql+asyncpg://username:password@host:port/database"
    - name: BETTER_AUTH_SECRET
      value: "your-better-auth-secret-here"
    - name: GROQ_API_KEY
      value: "your-groq-api-key-here"
    - name: GROQ_MODEL
      value: "openai/gpt-oss-20b"
    - name: FRONTEND_URL
      value: "http://localhost:3000"
    - name: CORS_ALLOW_CREDENTIALS
      value: "true"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 10
    failureThreshold: 3

# Frontend Configuration
frontend:
  enabled: true
  replicaCount: 1

  image:
    repository: phase-iv-frontend
    tag: latest
    pullPolicy: Never  # Use local image, don't pull from registry

  service:
    type: NodePort  # Expose to host machine
    port: 3000
    targetPort: 3000
    nodePort: 30000  # Access via minikube-ip:30000

  env:
    - name: NEXT_PUBLIC_API_URL
      value: "http://backend-service:8000"  # Internal cluster DNS
    - name: NEXT_PUBLIC_BASE_URL
      value: "http://localhost:3000"
    - name: BETTER_AUTH_SECRET
      value: "your-better-auth-secret-here"
    - name: DATABASE_URL
      value: "postgresql://username:password@host:port/database?sslmode=require"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5

# Service Account
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod Annotations and Labels
podAnnotations: {}
podLabels: {}

# Security Context
podSecurityContext: {}
securityContext: {}

# Node Selector, Tolerations, Affinity
nodeSelector: {}
tolerations: []
affinity: {}

# Ingress (disabled for local Minikube)
ingress:
  enabled: false

# Autoscaling (disabled for local development)
autoscaling:
  enabled: false
